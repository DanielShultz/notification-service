openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: API for creating notification batches and reading delivery statuses.
servers:
  - url: http://localhost:8013/api
    description: Local Docker Compose
paths:
  /v1/health:
    get:
      summary: Check service health
      operationId: getHealth
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/notification-batches:
    post:
      summary: Create notification batch
      operationId: createNotificationBatch
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 255
            pattern: '^[A-Za-z0-9._:-]+$'
          example: demo-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotificationBatchRequest"
            examples:
              transactionalSms:
                value:
                  channel: sms
                  traffic_type: transactional
                  message: "Access code: 1234"
                  recipient_ids:
                    - user-100
                    - user-101
              marketingEmail:
                value:
                  channel: email
                  traffic_type: marketing
                  message: "Monthly promo"
                  recipient_ids:
                    - user-200
      responses:
        "202":
          description: Batch was created and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNotificationBatchResponse"
        "200":
          description: Batch already exists for the provided idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateNotificationBatchResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request with this Idempotency-Key is already being processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notification-batches/{batchId}:
    get:
      summary: Get notification batch status
      operationId: getNotificationBatch
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationBatch"
        "404":
          description: Batch was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/notifications/{notificationId}/history:
    get:
      summary: Get one notification status history
      operationId: getNotificationHistory
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Notification history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationHistory"
        "404":
          description: Notification was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/recipients/{recipientId}/notifications:
    get:
      summary: Get recipient notification history
      operationId: getRecipientNotifications
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            type: string
          example: user-100
      responses:
        "200":
          description: Recipient notifications with status history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipientNotifications"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: notification-service
    CreateNotificationBatchRequest:
      type: object
      required:
        - channel
        - traffic_type
        - message
        - recipient_ids
      properties:
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        traffic_type:
          $ref: "#/components/schemas/TrafficType"
        message:
          type: string
          minLength: 1
          maxLength: 2000
          example: "Access code: 1234"
        recipient_ids:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
          example:
            - user-100
            - user-101
    CreateNotificationBatchResponse:
      type: object
      required:
        - batch_id
        - notification_count
        - duplicate
      properties:
        batch_id:
          type: string
          format: uuid
        notification_count:
          type: integer
          example: 2
        duplicate:
          type: boolean
          example: false
    NotificationBatch:
      type: object
      required:
        - batch_id
        - channel
        - traffic_type
        - recipient_count
        - status_counts
        - notifications
        - created_at
        - updated_at
      properties:
        batch_id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        traffic_type:
          $ref: "#/components/schemas/TrafficType"
        recipient_count:
          type: integer
          example: 2
        status_counts:
          type: object
          additionalProperties:
            type: integer
          example:
            delivered: 2
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationSummary"
        created_at:
          type: string
          example: "2026-05-19 20:32:43"
        updated_at:
          type: string
          example: "2026-05-19 20:32:43"
    NotificationSummary:
      type: object
      required:
        - notification_id
        - recipient_id
        - status
        - attempts
        - last_error
        - created_at
        - updated_at
      properties:
        notification_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          example: user-100
        status:
          $ref: "#/components/schemas/NotificationStatus"
        attempts:
          type: integer
          example: 1
        last_error:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          example: "2026-05-19 20:32:43"
        updated_at:
          type: string
          example: "2026-05-19 20:32:43"
    NotificationHistory:
      type: object
      required:
        - notification_id
        - batch_id
        - recipient_id
        - channel
        - traffic_type
        - status
        - attempts
        - last_error
        - history
      properties:
        notification_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          example: user-100
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        traffic_type:
          $ref: "#/components/schemas/TrafficType"
        status:
          $ref: "#/components/schemas/NotificationStatus"
        attempts:
          type: integer
          example: 1
        last_error:
          type: string
          nullable: true
          example: null
        history:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistoryEntry"
    RecipientNotifications:
      type: object
      required:
        - recipient_id
        - notifications
      properties:
        recipient_id:
          type: string
          example: user-100
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationHistory"
    StatusHistoryEntry:
      type: object
      required:
        - status
        - reason
        - created_at
      properties:
        status:
          $ref: "#/components/schemas/NotificationStatus"
        reason:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          example: "2026-05-19 20:32:43+00"
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Notification not found.
    NotificationChannel:
      type: string
      enum:
        - sms
        - email
    TrafficType:
      type: string
      enum:
        - transactional
        - marketing
    NotificationStatus:
      type: string
      enum:
        - queued
        - processing
        - sent
        - delivered
        - retry_scheduled
        - dropped
